# A weboldalról letölthető telepítőt teszi közzé.
# A telepítő ennek a tárolónak a "dist" ágán van (oda Claude tölti fel fordítás után),
# így a riftmester tároló akár privát is lehet – ez a folyamat nem függ tőle.
name: Telepítő közzététele

on:
  workflow_dispatch:
  push:
    paths: [version.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verzió
        id: ver
        run: echo "v=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")" >> $GITHUB_OUTPUT
      - name: Telepítő a dist ágról
        uses: actions/checkout@v4
        with:
          ref: dist
          path: inst
      - name: Kiadás
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.v }}"
          gh release delete "v$v" -R ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$v" -R ${{ github.repository }} --latest \
            -t "RiftMester $v" \
            -n "Lefordított, védett kiadás. A program magától frissül erre a verzióra." \
            inst/installers/RiftMester-Setup.exe inst/installers/RiftMester-portable.zip
